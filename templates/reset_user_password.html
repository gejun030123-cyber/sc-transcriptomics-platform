{% extends 'base.html' %}
{% block title %}重置用户密码{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 540px">
    <h1 class="h3 mb-3">重置 {{ target.username }} 的密码</h1>
    <p class="text-muted">重置后该用户的所有现有会话立即失效。请通过实验室内部渠道告知临时密码，并让用户登录后自行修改。</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off" class="card shadow-sm"><div class="card-body">
        <label class="form-label" for="password">新密码（至少 12 字符）</label>
        <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
        <label class="form-label" for="password_confirm">确认新密码</label>
        <input class="form-control mb-3" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" required>
        <button class="btn btn-primary" type="submit">重置密码</button>
        <a class="btn btn-link" href="{{ url_for('accounts.users') }}">返回用户管理</a>
    </div></form>
</div>
{% endblock %}
