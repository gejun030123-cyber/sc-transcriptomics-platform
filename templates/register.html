<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册账号 · oelab agent</title>
    <style>
        :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #10213c; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 10% 8%, #d9ebff, transparent 27rem), linear-gradient(135deg, #edf4fb, #f7fafc); }
        main { width: min(460px, calc(100% - 40px)); box-sizing: border-box; margin: 30px 0; padding: 34px; background: #fff; border: 1px solid #cad9ec; border-radius: 19px; box-shadow: 0 22px 55px rgba(19,56,105,.13); }
        h1 { margin: 0 0 8px; font-size: 1.6rem; }
        p { color: #62738d; line-height: 1.65; font-size: .9rem; }
        label { display: block; margin: 16px 0 6px; font-size: .88rem; font-weight: 650; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #cdd9e9; border-radius: 9px; font-size: 1rem; }
        button { width: 100%; margin: 24px 0 8px; padding: 11px; border: 0; border-radius: 9px; background: #1c5bc2; color: white; font-size: .95rem; cursor: pointer; }
        .notice { padding: 12px; border-radius: 8px; background: #e8f1fc; color: #174a8b; }
        .links { text-align: center; }
        a { color: #1c5bc2; }
    </style>
</head>
<body>
    <main>
        <h1>注册研究账号</h1>
        {% if registered %}
        <div class="notice" role="status">注册成功。现在可以使用用户名或邮箱登录。</div>
        {% else %}
        <p>填写用户名、邮箱和密码即可注册；无需手机号或管理员审核。邮箱大小写会影响登录，请记住填写时的写法。</p>
        {% if error %}<div class="notice" role="alert">{{ error }}</div>{% endif %}
        <form method="post" autocomplete="off">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" maxlength="64" value="{{ request.form.get('username', '') }}" required autofocus>
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" value="{{ request.form.get('email', '') }}" required>
            <label for="password">设置密码（至少 12 字符）</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
            <label for="password_confirm">确认密码</label>
            <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" required>
            <button type="submit">注册账号</button>
        </form>
        {% endif %}
        <p class="links"><a href="{{ url_for('platform_login') }}">返回登录</a></p>
    </main>
</body>
</html>
