{% extends "base.html" %}
{% block title %}新建项目{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3">新建项目</h4>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">项目名称</label>
                    <input type="text" name="name" class="form-control" required placeholder="例如：肿瘤类器官分析">
                </div>
                <div class="mb-3">
                    <label class="form-label">项目描述</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="可选描述..."></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">创建</button>
                    <a href="/" class="btn btn-outline-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
