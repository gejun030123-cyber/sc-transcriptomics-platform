{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 540px">
    <h1 class="h3 mb-3">修改密码</h1>
    <p class="text-muted">更改后当前会话会退出，请用新密码重新登录。</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off" class="card shadow-sm"><div class="card-body">
        <label class="form-label" for="current_password">当前密码</label>
        <input class="form-control mb-3" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        <label class="form-label" for="new_password">新密码（至少 12 字符）</label>
        <input class="form-control mb-3" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
        <label class="form-label" for="new_password_confirm">确认新密码</label>
        <input class="form-control mb-3" id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="12" required>
        <button class="btn btn-primary" type="submit">更新密码</button>
    </div></form>
</div>
{% endblock %}
