<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访问验证 - 生信分析平台</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #202124; }
        .card { width: min(420px, calc(100% - 40px)); box-sizing: border-box; padding: 32px; background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(26, 35, 126, .12); }
        h1 { margin: 0 0 8px; color: #1a237e; font-size: 1.45rem; }
        p { color: #6c757d; line-height: 1.6; }
        label { display: block; margin: 22px 0 7px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: 2px solid rgba(26, 35, 126, .2); border-color: #1a237e; }
        button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px; background: #1a237e; color: #fff; font-size: 1rem; cursor: pointer; }
        .error { padding: 10px 12px; border-radius: 8px; background: #fde8e8; color: #a61b1b; }
    </style>
</head>
<body>
    <main class="card">
        <h1>生信分析平台</h1>
        <p>请输入实验室访问密码。</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <form method="post" autocomplete="off">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="password">访问密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">进入平台</button>
        </form>
    </main>
</body>
</html>
