<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访问验证 · oelab agent</title>
    <style>
        :root { color-scheme: light; font-family: Inter, "Avenir Next", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 10% 8%, #d9ebff, transparent 27rem), linear-gradient(135deg, #edf4fb, #f7fafc); color: #10213c; }
        .card { width: min(420px, calc(100% - 40px)); box-sizing: border-box; padding: 34px; background: rgba(255,255,255,.9); border: 1px solid rgba(202,218,236,.9); border-radius: 19px; box-shadow: 0 22px 55px rgba(19, 56, 105, .13); }
        .eyebrow { color: #2362ae; font-size: .68rem; font-weight: 750; letter-spacing: .13em; margin-bottom: 11px; text-transform: uppercase; }
        h1 { letter-spacing: -.035em; margin: 0 0 8px; color: #10213c; font-size: 1.55rem; }
        p { color: #6b7b93; font-size: .88rem; line-height: 1.65; }
        label { display: block; margin: 24px 0 7px; font-size: .86rem; font-weight: 650; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #cdd9e9; border-radius: 9px; font-size: 1rem; }
        input:focus { outline: 3px solid rgba(38, 111, 209, .12); border-color: #4e8edf; }
        button { width: 100%; margin-top: 21px; padding: 11px; border: 0; border-radius: 9px; background: linear-gradient(135deg, #1c5bc2, #123e93); box-shadow: 0 8px 17px rgba(23,78,166,.2); color: #fff; font-size: .9rem; font-weight: 650; cursor: pointer; }
        .error { padding: 10px 12px; border-radius: 8px; background: #e8f1fc; color: #174a8b; }
    </style>
</head>
<body>
    <main class="card">
        <div class="eyebrow">Research intelligence</div>
        <h1>oelab agent</h1>
        <p>请输入实验室访问密码以进入研究工作空间。</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <form method="post" autocomplete="off">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="password">访问密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">进入平台</button>
        </form>
    </main>
</body>
</html>
